plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avfmacos.vmdisplay'
    compileSdk 36

    defaultConfig {
        applicationId "com.avfmacos.vmdisplay"
        // AVF-for-apps (android.system.virtualmachine as a stable public API,
        // with display/GPU support in VirtualMachineCustomImageConfig) needs
        // a recent Android version -- 34 (Android 14) is the conservative
        // floor; bump if APIs used here turn out to need more.
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// android.system.virtualmachine is delivered by the com.android.virt
// mainline module directly on the device's BOOTCLASSPATH (confirmed via
// /apex/com.android.virt/etc/classpaths/bootclasspath.pb on a real Pixel 7)
// -- it needs no <uses-sdk-library> manifest entry and is present at
// runtime automatically, but isn't part of any standard compileSdk platform
// stub jar. The on-device jar
// (/apex/com.android.virt/javalib/framework-virtualization.jar) turned out
// to contain classes.dex (ART bytecode), not .class files, so it's
// unusable as a javac classpath entry directly. :stubs is a hand-written
// compile-only stand-in (real method signatures, empty bodies) -- never
// packaged into the APK; at runtime the actual on-device classes resolve
// via the BOOTCLASSPATH instead, same as any other framework class.
dependencies {
    compileOnly project(':stubs')
}
