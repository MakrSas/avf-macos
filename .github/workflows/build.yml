name: build-loader

on:
  push:
    paths:
      - 'loader/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build bootloader
        working-directory: loader
        run: make CROSS=aarch64-linux-gnu-

      - name: Show size
        working-directory: loader
        run: |
          ls -la build/
          aarch64-linux-gnu-size build/bootloader.elf

      - uses: actions/upload-artifact@v4
        with:
          name: bootloader
          path: |
            loader/build/bootloader.bin
            loader/build/bootloader.elf
