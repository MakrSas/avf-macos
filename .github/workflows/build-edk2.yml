name: build-edk2

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/build-edk2.yml'
      - 'edk2-platform/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential uuid-dev iasl git python3 python3-pip nasm

      - name: Checkout edk2 (pinned stable tag, with submodules)
        env:
          EDK2_TAG: edk2-stable202511
        run: |
          # Pinned rather than floating `master`: a build that succeeded
          # against master minutes earlier failed on a re-clone with an
          # unrelated error (BaseCachingPciExpressLib module-type mismatch)
          # -- master is actively developed and moved under us. A stable
          # tag keeps builds reproducible.
          git clone --depth 1 --branch "$EDK2_TAG" --recurse-submodules \
            --shallow-submodules https://github.com/tianocore/edk2.git edk2

      - name: Patch serial driver to NS16550A (confirmed real UART, not PL011)
        working-directory: edk2
        run: |
          # ArmVirtPkg defaults to FdtPL011SerialPortLib, which looks for an
          # "arm,pl011" compatible DTB node -- our confirmed AVF hardware
          # exposes ns16550a instead (docs/AVF_HARDWARE.md), so that lookup
          # never finds anything and produces zero console output. Swap in
          # the stock generic 16550 lib, whose defaults already match our
          # hardware almost exactly (PcdSerialRegisterBase=0x3F8,
          # PcdSerialRegisterAccessWidth=8, PcdSerialClockRate=1843200 --
          # all confirmed from the real DTB dump) -- only PcdSerialUseMmio
          # needs overriding to TRUE since ARM has no port-IO space.
          #
          # Uses a small python script rather than sed: the SEC/PEI_CORE/PEIM
          # section overrides need PlatformHookLib AND a module-type-generic
          # PciExpressLib (BaseCachingPciExpressLib, used globally in
          # [LibraryClasses.common], only supports DXE_DRIVER/UEFI_DRIVER/
          # UEFI_APPLICATION -- confirmed by isolation testing that swapping
          # serial libs exposes this pre-existing latent gap, since it makes
          # the build actually resolve PciExpressLib for those phases where
          # it previously wasn't reached), but the main
          # [LibraryClasses.common] section must NOT get a second
          # PciExpressLib override (would conflict with the existing one).
          python3 - <<'PYEOF'
          import re

          inc_path = "ArmVirtPkg/ArmVirt.dsc.inc"
          with open(inc_path) as f:
              text = f.read()

          text = text.replace(
              "ArmVirtPkg/Library/FdtPL011SerialPortLib/FdtPL011SerialPortLib.inf",
              "MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550.inf",
          )
          text = text.replace(
              "ArmVirtPkg/Library/FdtPL011SerialPortLib/EarlyFdtPL011SerialPortLib.inf",
              "MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550.inf",
          )

          # BaseCachingPciExpressLib only supports DXE_DRIVER/UEFI_DRIVER/
          # UEFI_APPLICATION. Swapping the serial lib makes the build actually
          # resolve PciExpressLib for phases that never reached it before
          # (DXE_CORE, SEC, PEI_CORE, PEIM -- discovered one at a time as each
          # fix exposed the next). Simplest robust fix: replace the single
          # global declaration with the module-type-generic MdePkg variant
          # instead of chasing per-section overrides -- correctness over the
          # caching optimization, which doesn't matter for early bring-up.
          text = text.replace(
              "PciExpressLib|OvmfPkg/Library/BaseCachingPciExpressLib/BaseCachingPciExpressLib.inf",
              "PciExpressLib|MdePkg/Library/BasePciExpressLib/BasePciExpressLib.inf",
          )

          # BaseSerialPortLib16550 needs PlatformHookLib in every phase that
          # resolves SerialPortLib (main + SEC + PEI_CORE + PEIM).
          sections = text.split("\n[")
          for i, sec in enumerate(sections):
              sec = re.sub(
                  r"(SerialPortLib\|MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550\.inf\n)",
                  r"\1  PlatformHookLib|MdeModulePkg/Library/BasePlatformHookLibNull/BasePlatformHookLibNull.inf\n",
                  sec,
                  count=1,
              )
              sections[i] = sec

          text = "\n[".join(sections)
          with open(inc_path, "w") as f:
              f.write(text)
          PYEOF
          sed -i \
            '/\[PcdsFixedAtBuild.common\]/a\  gEfiMdeModulePkgTokenSpaceGuid.PcdSerialUseMmio|TRUE' \
            ArmVirtPkg/ArmVirtQemuKernel.dsc
          echo "--- verifying patch applied ---"
          grep -n "SerialPortLib\|PlatformHookLib\|PciExpressLib" ArmVirtPkg/ArmVirt.dsc.inc
          grep -n "PcdSerialUseMmio" ArmVirtPkg/ArmVirtQemuKernel.dsc

      - name: Insert raw UART checkpoints into PrePi.c for isolation
        working-directory: edk2
        run: |
          # PrePi.c's first real serial output (the "UEFI firmware (version...)"
          # banner) happens AFTER ArchInitialize/HobConstructor/
          # InvalidateDataCacheRange/ProcessLibraryConstructorList/MemoryPeim --
          # if any of those crash or hang, there is no possible output even
          # with a correct serial driver, since SerialPortInitialize() hasn't
          # run yet either. Insert raw, library-independent UART byte writes
          # (same technique used successfully to debug our own loader: see
          # docs/PROGRESS.md) at each checkpoint to find exactly where
          # execution stops, bypassing SerialPortInitialize/DebugLib entirely.
          python3 - <<'PYEOF'
          path = "ArmVirtPkg/PrePi/PrePi.c"
          with open(path) as f:
              text = f.read()

          probe_decl = '''
          #define AVF_PROBE(c) (*(volatile unsigned char *)0x3f8UL = (c))
          '''
          text = text.replace(
              '#include "PrePi.h"',
              '#include "PrePi.h"\n' + probe_decl,
              1,
          )

          checkpoints = [
              ("  // Initialize the architecture specific bits\n  ArchInitialize ();",
               "  AVF_PROBE('1');\n  // Initialize the architecture specific bits\n  ArchInitialize ();\n  AVF_PROBE('2');"),
              ("  PrePeiSetHobList (HobList);",
               "  PrePeiSetHobList (HobList);\n  AVF_PROBE('3');"),
              ("  InvalidateDataCacheRange ((VOID *)(UINTN)PcdGet64 (PcdFdBaseAddress), PcdGet32 (PcdFdSize));",
               "  InvalidateDataCacheRange ((VOID *)(UINTN)PcdGet64 (PcdFdBaseAddress), PcdGet32 (PcdFdSize));\n  AVF_PROBE('4');"),
              ("  ProcessLibraryConstructorList ();",
               "  ProcessLibraryConstructorList ();\n  AVF_PROBE('5');"),
              ("  Status = MemoryPeim (UefiMemoryBase, FixedPcdGet32 (PcdSystemMemoryUefiRegionSize));\n  ASSERT_EFI_ERROR (Status);",
               "  Status = MemoryPeim (UefiMemoryBase, FixedPcdGet32 (PcdSystemMemoryUefiRegionSize));\n  AVF_PROBE('6');\n  ASSERT_EFI_ERROR (Status);\n  AVF_PROBE('7');"),
          ]
          for old, new in checkpoints:
              if old not in text:
                  print(f"WARNING: checkpoint anchor not found: {old[:60]!r}")
              text = text.replace(old, new, 1)

          text = text.replace(
              "VOID\nCEntryPoint (",
              "VOID\nCEntryPoint (",
          )
          # Earliest possible C-level checkpoint: first line of CEntryPoint.
          text = text.replace(
              "  UINT64  StartTimeStamp;\n",
              "  UINT64  StartTimeStamp;\n\n  AVF_PROBE('0');\n",
              1,
          )

          with open(path, "w") as f:
              f.write(text)
          print("--- patched PrePi.c ---")
          print(text[:3000])
          PYEOF

      - name: Bypass ARM64-Linux-header magic check that skips DRAM discovery
        working-directory: edk2
        run: |
          # Root cause (found via the checkpoint probes above -- execution
          # stopped between checkpoint 5 and 6, i.e. inside/before
          # MemoryPeim()): ModuleEntryPoint.S's DiscoverDramFromDt gates its
          # entire body -- including the FindMemnode() call that reads
          # PcdSystemMemoryBase/Size from the DTB -- behind a check for the
          # ARM64 Linux "Image" header magic ("ARM\x64") at offset 0x38 of
          # the image-base pointer it receives in x1. Our AVF bootloader
          # entry (like our own hand-written loader, confirmed working)
          # doesn't provide that header/convention, so the magic check
          # fails, the whole DRAM-discovery block is skipped via `bne
          # .Lout`, PcdSystemMemorySize stays at its default of 0, and
          # MemoryPeim()'s `ASSERT (PcdGet64 (PcdSystemMemorySize) != 0)`
          # hangs forever in CpuDeadLoop() -- exactly matching the observed
          # "012345 then silence".
          #
          # Fix: skip the magic check and PE/COFF relocation entirely (the
          # checkpoint probes already proved code runs correctly without
          # relocation ever having happened) and call FindMemnode directly
          # using x28 (the DTB pointer from x0, preserved earlier and
          # already confirmed valid by our own loader).
          python3 - <<'PYEOF'
          path = "ArmVirtPkg/PrePi/ModuleEntryPoint.S"
          with open(path) as f:
              text = f.read()

          old_block = text[text.index("ASM_PFX(DiscoverDramFromDt):"):text.index(".LArm64LinuxMagic:")]
          new_block = """ASM_PFX(DiscoverDramFromDt):
  mov   x29, x30            // preserve LR

  //
  // AVF-PATCHED: skip the ARM64 Linux Image header magic check and PE/COFF
  // relocation entirely (not needed -- see build workflow comment) and
  // discover DRAM directly from the DTB pointer already in x28.
  //
  mov   x0, x28
  adr   x1, PcdGet64 (PcdSystemMemoryBase)
  adr   x2, PcdGet64 (PcdSystemMemorySize)
  bl    FindMemnode

.Lout:
  ret    x29

"""
          assert old_block in text, "DiscoverDramFromDt block not found for replacement"
          text = text.replace(old_block, new_block)

          with open(path, "w") as f:
              f.write(text)
          print("--- patched ModuleEntryPoint.S ---")
          print(text)
          PYEOF

      - name: Build BaseTools
        working-directory: edk2
        run: make -C BaseTools

      - name: Build ArmVirtQemuKernel AARCH64
        working-directory: edk2
        env:
          GCC_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          source edksetup.sh
          # DEBUG, not RELEASE: RELEASE builds compile out DEBUG()-gated
          # early boot log messages entirely (this is *why* our first
          # working-per-CI RELEASE firmware still showed empty console on
          # real hardware even after the serial-driver fix -- confirmed by
          # comparing against a leftover ~64MB firmware from an earlier,
          # unrelated manual experiment, consistent with a DEBUG-sized
          # build, which also showed empty console, i.e. hit the same
          # PL011-vs-16550 issue we already fixed here). DEBUG output is
          # what we actually need to see boot progress right now.
          build -a AARCH64 -t GCC -b DEBUG -p ArmVirtPkg/ArmVirtQemuKernel.dsc

      - name: Locate output firmware
        working-directory: edk2
        run: |
          find Build -iname '*.fd' -o -iname '*.efi' | tee /tmp/edk2-outputs.txt
          find Build -iname 'QEMU_EFI*' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: edk2-armvirt-firmware
          path: |
            edk2/Build/ArmVirtQemuKernel-AArch64/DEBUG_GCC/FV/QEMU_EFI.fd
            edk2/Build/ArmVirtQemuKernel-AArch64/DEBUG_GCC/FV/QEMU_VARS.fd
