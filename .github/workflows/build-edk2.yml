name: build-edk2

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/build-edk2.yml'
      - 'edk2-platform/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential uuid-dev iasl git python3 python3-pip nasm

      - name: Checkout edk2 (pinned stable tag, with submodules)
        env:
          EDK2_TAG: edk2-stable202511
        run: |
          # Pinned rather than floating `master`: a build that succeeded
          # against master minutes earlier failed on a re-clone with an
          # unrelated error (BaseCachingPciExpressLib module-type mismatch)
          # -- master is actively developed and moved under us. A stable
          # tag keeps builds reproducible.
          git clone --depth 1 --branch "$EDK2_TAG" --recurse-submodules \
            --shallow-submodules https://github.com/tianocore/edk2.git edk2

      - name: Patch serial driver to NS16550A (confirmed real UART, not PL011)
        working-directory: edk2
        run: |
          # ArmVirtPkg defaults to FdtPL011SerialPortLib, which looks for an
          # "arm,pl011" compatible DTB node -- our confirmed AVF hardware
          # exposes ns16550a instead (docs/AVF_HARDWARE.md), so that lookup
          # never finds anything and produces zero console output. Swap in
          # the stock generic 16550 lib, whose defaults already match our
          # hardware almost exactly (PcdSerialRegisterBase=0x3F8,
          # PcdSerialRegisterAccessWidth=8, PcdSerialClockRate=1843200 --
          # all confirmed from the real DTB dump) -- only PcdSerialUseMmio
          # needs overriding to TRUE since ARM has no port-IO space.
          #
          # Uses a small python script rather than sed: the SEC/PEI_CORE/PEIM
          # section overrides need PlatformHookLib AND a module-type-generic
          # PciExpressLib (BaseCachingPciExpressLib, used globally in
          # [LibraryClasses.common], only supports DXE_DRIVER/UEFI_DRIVER/
          # UEFI_APPLICATION -- confirmed by isolation testing that swapping
          # serial libs exposes this pre-existing latent gap, since it makes
          # the build actually resolve PciExpressLib for those phases where
          # it previously wasn't reached), but the main
          # [LibraryClasses.common] section must NOT get a second
          # PciExpressLib override (would conflict with the existing one).
          python3 - <<'PYEOF'
          import re

          inc_path = "ArmVirtPkg/ArmVirt.dsc.inc"
          with open(inc_path) as f:
              text = f.read()

          text = text.replace(
              "ArmVirtPkg/Library/FdtPL011SerialPortLib/FdtPL011SerialPortLib.inf",
              "MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550.inf",
          )

          sections = text.split("\n[")
          for i, sec in enumerate(sections):
              header_line = sec.split("\n", 1)[0]
              # Main [LibraryClasses.common]: DXE_CORE (DxeMain.inf) also needs
              # PlatformHookLib once serial libs change, but NOT a PciExpressLib
              # override -- the existing BaseCachingPciExpressLib override in
              # this same section is untouched and must not be duplicated.
              if not header_line.startswith("LibraryClasses.common]"):
                  continue
              sec = re.sub(
                  r"(SerialPortLib\|MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550\.inf\n)",
                  r"\1  PlatformHookLib|MdeModulePkg/Library/BasePlatformHookLibNull/BasePlatformHookLibNull.inf\n",
                  sec,
                  count=1,
              )
              sections[i] = sec
          for i, sec in enumerate(sections):
              header_line = sec.split("\n", 1)[0]
              is_early_phase = header_line.startswith(
                  ("LibraryClasses.common.SEC", "LibraryClasses.common.PEI_CORE", "LibraryClasses.common.PEIM")
              )
              if not is_early_phase:
                  continue
              sec = sec.replace(
                  "ArmVirtPkg/Library/FdtPL011SerialPortLib/EarlyFdtPL011SerialPortLib.inf",
                  "MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550.inf",
              )
              sec = re.sub(
                  r"(SerialPortLib\|MdeModulePkg/Library/BaseSerialPortLib16550/BaseSerialPortLib16550\.inf\n)",
                  r"\1  PlatformHookLib|MdeModulePkg/Library/BasePlatformHookLibNull/BasePlatformHookLibNull.inf\n"
                  r"  PciExpressLib|MdePkg/Library/BasePciExpressLib/BasePciExpressLib.inf\n",
                  sec,
                  count=1,
              )
              sections[i] = sec

          text = "\n[".join(sections)
          with open(inc_path, "w") as f:
              f.write(text)
          PYEOF
          sed -i \
            '/\[PcdsFixedAtBuild.common\]/a\  gEfiMdeModulePkgTokenSpaceGuid.PcdSerialUseMmio|TRUE' \
            ArmVirtPkg/ArmVirtQemuKernel.dsc
          echo "--- verifying patch applied ---"
          grep -n "SerialPortLib\|PlatformHookLib\|PciExpressLib" ArmVirtPkg/ArmVirt.dsc.inc
          grep -n "PcdSerialUseMmio" ArmVirtPkg/ArmVirtQemuKernel.dsc

      - name: Build BaseTools
        working-directory: edk2
        run: make -C BaseTools

      - name: Build ArmVirtQemuKernel AARCH64
        working-directory: edk2
        env:
          GCC_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          source edksetup.sh
          build -a AARCH64 -t GCC -b RELEASE -p ArmVirtPkg/ArmVirtQemuKernel.dsc

      - name: Locate output firmware
        working-directory: edk2
        run: |
          find Build -iname '*.fd' -o -iname '*.efi' | tee /tmp/edk2-outputs.txt
          find Build -iname 'QEMU_EFI*' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: edk2-armvirt-firmware
          path: |
            edk2/Build/ArmVirtQemuKernel-AArch64/RELEASE_GCC/FV/QEMU_EFI.fd
            edk2/Build/ArmVirtQemuKernel-AArch64/RELEASE_GCC/FV/QEMU_VARS.fd
