name: build-android-app

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform/build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        working-directory: android-app
        run: find . -iname '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: vmdisplay-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
